name: Build and push arm64 Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "docker/**/Dockerfile"

permissions:
  contents: read

jobs:
  changes:
    name: Find changed Dockerfiles
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create image matrix
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            ./scripts/changed-images.sh all > images.json
          else
            ./scripts/changed-images.sh changed "${BEFORE_SHA}" "${AFTER_SHA}" > images.json
          fi
          echo "images=$(cat images.json)" >> "${GITHUB_OUTPUT}"
          cat images.json

      - name: Save image matrix for manifest publishing
        uses: actions/upload-artifact@v4
        with:
          name: image-list
          path: images.json
          if-no-files-found: error

  build-and-push:
    name: Build and push ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04-arm
    environment: dev_auth
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: alanway
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: dockerfiles-builder
          driver: docker-container
          use: true

      - name: Build and push arm64 image
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: ./scripts/d.sh release-arm64 --tag "${IMAGE_TAG}"
