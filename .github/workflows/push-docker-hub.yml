name: Build and push changed Docker images

on:
  push:
    branches:
      - master
    paths:
      - "docker/**/Dockerfile"
      - ".github/workflows/push-docker-hub.yml"

permissions:
  contents: read

jobs:
  changes:
    name: Find changed Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
      claude_images: ${{ steps.changed.outputs.claude_images }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create image matrix
        id: changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          empty_tree="$(git hash-object -t tree /dev/null)"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${BEFORE_SHA}" == "${zero_sha}" ]]; then
            base="${empty_tree}"
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BEFORE_SHA}" || true
            fi

            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="${BEFORE_SHA}"
            elif git cat-file -e "${AFTER_SHA}^" 2>/dev/null; then
              echo "Warning: the push base is unavailable; comparing with the previous commit."
              base="${AFTER_SHA}^"
            else
              echo "Warning: no parent commit is available; comparing with the empty tree."
              base="${empty_tree}"
            fi
          fi

          mapfile -t dockerfiles < <(
            git diff --name-only --diff-filter=ACMRT "${base}" "${AFTER_SHA}" -- \
              ':(glob)docker/**/Dockerfile' | LC_ALL=C sort -u
          )

          images=()
          for dockerfile in "${dockerfiles[@]}"; do
            [[ -f "${dockerfile}" ]] || continue

            if [[ "${dockerfile}" =~ ^docker/([^/]+)/([^/]+)/Dockerfile$ ]]; then
              images+=("${BASH_REMATCH[1]}:${BASH_REMATCH[2]}")
            else
              echo "Invalid Dockerfile path: ${dockerfile}" >&2
              echo "Expected docker/<image>/<version>/Dockerfile." >&2
              exit 1
            fi
          done

          # Export settings affect both multi-platform images even without Dockerfile changes.
          if ! git diff --quiet "${base}" "${AFTER_SHA}" -- .github/workflows/push-docker-hub.yml; then
            images+=("dev:claude-in-one" "dev:claude-multica")
          fi

          images_json="$(printf '%s\n' "${images[@]}" | jq -R -s -c \
            'split("\n") | map(select(length > 0)) | unique')"
          echo "Changed images: ${images_json}"

          # Keep the base image before claude-multica, which pulls it from Docker Hub.
          claude_images_json="$(jq -c \
            '[.[] | select(. == "dev:claude-in-one" or . == "dev:claude-multica")] | sort' \
            <<< "${images_json}")"
          images_json="$(jq -c \
            '[.[] | select(. != "dev:claude-in-one" and . != "dev:claude-multica")]' \
            <<< "${images_json}")"
          echo "images=${images_json}" >> "${GITHUB_OUTPUT}"
          echo "claude_images=${claude_images_json}" >> "${GITHUB_OUTPUT}"

  build-and-push-claude:
    name: Build and push multi-platform Claude images
    needs: changes
    if: needs.changes.outputs.claude_images != '[]'
    runs-on: ubuntu-latest
    environment: dev_auth
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: alanway
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_ALIYUN_USER }}
          password: ${{ secrets.DOCKER_ALIYUN_PASSWORD }}

      - name: Publish Docker Hub multi-platform and Aliyun AMD64 images in dependency order
        shell: bash
        env:
          CLAUDE_IMAGES: ${{ needs.changes.outputs.claude_images }}
        run: |
          set -euo pipefail
          mapfile -t images < <(jq -r '.[]' <<< "${CLAUDE_IMAGES}")
          for image_tag in "${images[@]}"; do
            image_dir="docker/${image_tag%%:*}/${image_tag#*:}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --sbom=false \
              --tag "alanway/${image_tag}" \
              --file "${image_dir}/Dockerfile" \
              --output type=registry,oci-mediatypes=false \
              "${image_dir}"

            # Reuse the builder cache; Aliyun receives only AMD64, without OCI attestations.
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --tag "registry.cn-hangzhou.aliyuncs.com/alanwei/${image_tag}" \
              --file "${image_dir}/Dockerfile" \
              --output type=registry,oci-mediatypes=false \
              "${image_dir}"
          done

  build-and-push:
    name: Build and push ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    environment: dev_auth
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: alanway
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_ALIYUN_USER }}
          password: ${{ secrets.DOCKER_ALIYUN_PASSWORD }}

      - name: Build image
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: ./scripts/d.sh build --tag "${IMAGE_TAG}"

      - name: Push image to Docker Hub
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: ./scripts/d.sh push-hub --tag "${IMAGE_TAG}"

      - name: Push image to Aliyun Container Registry
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: ./scripts/d.sh push-aliyun --tag "${IMAGE_TAG}"
